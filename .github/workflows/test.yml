name: Tests

on:
  push:
    branches: [main]
  pull_request:

env:
  ANKER_API: anker-solix-api @ https://github.com/thomluther/anker-solix-api/archive/refs/tags/v3.9.1.tar.gz

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Lint
        run: uvx ruff check --select F,E9 anker_ups.py ankerups tests

      - name: Unit tests
        run: uv run --python 3.12 --with pytest --with matplotlib --with "${{ env.ANKER_API }}" pytest -q tests

      - name: Script starts with its dependencies
        run: uv run --python 3.12 anker_ups.py --help
